<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1" th:text="${inscription.id == null ? 'Nouvelle Inscription' : 'Modifier Inscription'}"></h1>
            <p class="text-app-muted mb-0">Inscrivez un étudiant à un cours</p>
        </div>
    </div>

    <div class="card bg-app-panel border-app rounded-4 shadow-app"><div class="card-body p-4 p-md-5">
            <form th:action="@{/inscriptions/enregistrer}" th:object="${inscription}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="dateInscription" class="form-label text-app-muted">Date d'inscription</label>
                    <input type="date" class="form-control" id="dateInscription" th:field="*{dateInscription}" required>
                </div>

                <div class="mb-3">
                    <label for="etudiant" class="form-label text-app-muted">Étudiant</label>
                    <select class="form-select" id="etudiant" th:field="*{etudiant}" required>
                        <option value="">Sélectionner un étudiant</option>
                        <option th:each="etu : ${etudiants}" th:value="${etu.id}" th:text="${etu.matricule + ' - ' + etu.prenom + ' ' + etu.nom}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="cours" class="form-label text-app-muted">Cours</label>
                    <select class="form-select" id="cours" th:field="*{cours}" required>
                        <option value="">Sélectionner un cours</option>
                        <option th:each="c : ${coursList}" th:value="${c.id}" th:text="${c.code + ' - ' + c.intitule}"></option>
                    </select>
                </div>

                <div class="d-flex gap-2 mt-4 pt-4 border-top border-app">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> Enregistrer
                    </button>
                    <a th:href="@{/inscriptions}" class="btn btn-outline-light">
                        <i class="bi bi-arrow-left"></i> Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
