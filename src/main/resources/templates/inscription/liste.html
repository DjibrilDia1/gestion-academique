<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="page-header">
        <div>
            <h1 class="page-title">Liste des Inscriptions</h1>
            <p class="page-subtitle">Suivez les inscriptions des étudiants aux cours</p>
        </div>
        <a th:href="@{/inscriptions/nouveau}" class="btn btn-primary-custom">
            <i class="bi bi-plus-circle"></i> Nouvelle Inscription
        </a>
    </div>

    <div class="custom-card">
        <div class="custom-card-body" th:if="${!#lists.isEmpty(inscriptions)}">
            <div class="table-count">
                <i class="bi bi-card-checklist"></i>
                <span th:text="${#lists.size(inscriptions)} + ' inscription(s)'">0 inscription(s)</span>
            </div>
            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Étudiant</th>
                            <th>Cours</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="inscription : ${inscriptions}">
                            <td th:text="${inscription.dateInscription}"></td>
                            <td th:text="${inscription.etudiant.prenom + ' ' + inscription.etudiant.nom}"></td>
                            <td th:text="${inscription.cours.intitule}"></td>
                            <td class="actions-cell">
                                <a th:href="@{/inscriptions/modifier/{id}(id=${inscription.id})}" class="btn-action btn-action-edit">
                                    <i class="bi bi-pencil"></i> Modifier
                                </a>
                                <a th:href="@{/inscriptions/supprimer/{id}(id=${inscription.id})}" class="btn-action btn-action-delete" onclick="return confirm('Êtes-vous sûr ?')">
                                    <i class="bi bi-trash"></i> Supprimer
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(inscriptions)}">
            <i class="bi bi-card-checklist"></i>
            <p>Aucune inscription trouvée. Commencez par en ajouter une.</p>
        </div>
    </div>

</div>
</body>
</html>
