<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Liste des Inscriptions</h1>
        <a th:href="@{/inscriptions/nouveau}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nouvelle Inscription</a>
    </div>
    
    <div class="card shadow">
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Étudiant</th>
                        <th>Cours</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inscription : ${inscriptions}">
                        <td th:text="${inscription.dateInscription}"></td>
                        <td th:text="${inscription.etudiant.prenom + ' ' + inscription.etudiant.nom}"></td>
                        <td th:text="${inscription.cours.intitule}"></td>
                        <td>
                            <a th:href="@{/inscriptions/modifier/{id}(id=${inscription.id})}" class="btn btn-sm btn-warning">Modifier</a>
                            <a th:href="@{/inscriptions/supprimer/{id}(id=${inscription.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Êtes-vous sûr ?')">Supprimer</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(inscriptions)}">
                        <td colspan="4" class="text-center">Aucune inscription trouvée.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
