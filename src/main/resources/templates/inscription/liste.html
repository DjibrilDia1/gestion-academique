<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">Liste des Inscriptions</h1><p class="text-app-muted mb-0">Suivez les inscriptions des étudiants aux cours</p>
        </div>
        <a th:href="@{/inscriptions/nouveau}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Nouvelle Inscription
        </a>
    </div>

    <div class="card bg-app-panel border-app rounded-4 shadow-app">
        <div class="card-body p-0" th:if="${!#lists.isEmpty(inscriptions)}">
            <div class="d-inline-flex align-items-center gap-2 m-4 px-3 py-1 rounded-pill border border-app text-app-muted small">
                <i class="bi bi-card-checklist"></i>
                <span th:text="${#lists.size(inscriptions)} + ' inscription(s)'">0 inscription(s)</span>
            </div>
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Étudiant</th>
                            <th>Cours</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="inscription : ${inscriptions}">
                            <td th:text="${inscription.dateInscription}"></td>
                            <td th:text="${inscription.etudiant.prenom + ' ' + inscription.etudiant.nom}"></td>
                            <td th:text="${inscription.cours.intitule}"></td>
                            <td class="text-nowrap">
                                <a th:href="@{/inscriptions/modifier/{id}(id=${inscription.id})}" class="btn btn-sm btn-outline-warning">
                                    <i class="bi bi-pencil"></i> Modifier
                                </a>
                                <a th:href="@{/inscriptions/supprimer/{id}(id=${inscription.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Êtes-vous sûr ?')">
                                    <i class="bi bi-trash"></i> Supprimer
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="text-center text-app-subtle p-5" th:if="${#lists.isEmpty(inscriptions)}">
            <i class="bi bi-card-checklist"></i>
            <p>Aucune inscription trouvée. Commencez par en ajouter une.</p>
        </div>
    </div>

</div>
</body>
</html>
