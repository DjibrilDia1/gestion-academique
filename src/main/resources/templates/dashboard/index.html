<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <h1 class="mb-4">Tableau de bord</h1>
    <div class="row">
        <div class="col-md-4">
            <div class="card text-white bg-primary mb-3 shadow">
                <div class="card-body">
                    <h5 class="card-title">Étudiants Inscrits</h5>
                    <p class="card-text display-4" th:text="${totalEtudiants}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success mb-3 shadow">
                <div class="card-body">
                    <h5 class="card-title">Cours Disponibles</h5>
                    <p class="card-text display-4" th:text="${totalCours}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-warning mb-3 shadow">
                <div class="card-body">
                    <h5 class="card-title">Total Inscriptions</h5>
                    <p class="card-text display-4" th:text="${totalInscriptions}">0</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
