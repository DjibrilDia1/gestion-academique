<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="page-header">
        <div>
            <h1 class="page-title">Liste des Notes</h1>
            <p class="page-subtitle">Consultez et gérez les évaluations des étudiants</p>
        </div>
        <a th:href="@{/notes/nouveau}" class="btn btn-primary-custom">
            <i class="bi bi-plus-circle"></i> Saisir une Note
        </a>
    </div>

    <div class="custom-card">
        <div class="custom-card-body" th:if="${!#lists.isEmpty(notes)}">
            <div class="table-count">
                <i class="bi bi-award"></i>
                <span th:text="${#lists.size(notes)} + ' note(s)'">0 note(s)</span>
            </div>
            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                        <tr>
                            <th>Étudiant</th>
                            <th>Cours</th>
                            <th>Type d'Évaluation</th>
                            <th>Valeur (/20)</th>
                            <th>Coefficient</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="note : ${notes}">
                            <td th:text="${note.inscription.etudiant.prenom + ' ' + note.inscription.etudiant.nom}"></td>
                            <td th:text="${note.inscription.cours.intitule}"></td>
                            <td><span class="badge-type" th:text="${note.typeEvaluation}"></span></td>
                            <td>
                                <span class="badge-grade"
                                      th:classappend="${note.valeur >= 16 ? 'excellent' : (note.valeur >= 12 ? 'good' : (note.valeur >= 10 ? 'average' : 'low'))}"
                                      th:text="${note.valeur}"></span>
                            </td>
                            <td th:text="${note.coefficient}"></td>
                            <td class="actions-cell">
                                <a th:href="@{/notes/modifier/{id}(id=${note.id})}" class="btn-action btn-action-edit">
                                    <i class="bi bi-pencil"></i> Modifier
                                </a>
                                <a th:href="@{/notes/supprimer/{id}(id=${note.id})}" class="btn-action btn-action-delete" onclick="return confirm('Êtes-vous sûr ?')">
                                    <i class="bi bi-trash"></i> Supprimer
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(notes)}">
            <i class="bi bi-award"></i>
            <p>Aucune note trouvée. Commencez par en saisir une.</p>
        </div>
    </div>

</div>
</body>
</html>
