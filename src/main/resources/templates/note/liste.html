<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">Liste des Notes</h1><p class="text-app-muted mb-0">Consultez et gérez les évaluations des étudiants</p>
        </div>
        <a th:href="@{/notes/nouveau}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Saisir une Note
        </a>
    </div>

    <div class="card bg-app-panel border-app rounded-4 shadow-app">
        <div class="card-body p-0" th:if="${!#lists.isEmpty(notes)}">
            <div class="d-inline-flex align-items-center gap-2 m-4 px-3 py-1 rounded-pill border border-app text-app-muted small">
                <i class="bi bi-award"></i>
                <span th:text="${#lists.size(notes)} + ' note(s)'">0 note(s)</span>
            </div>
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Étudiant</th>
                            <th>Cours</th>
                            <th>Type d'Évaluation</th>
                            <th>Valeur (/20)</th>
                            <th>Coefficient</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="note : ${notes}">
                            <td th:text="${note.inscription.etudiant.prenom + ' ' + note.inscription.etudiant.nom}"></td>
                            <td th:text="${note.inscription.cours.intitule}"></td>
                            <td><span class="badge text-bg-secondary" th:text="${note.typeEvaluation}"></span></td>
                            <td>
                                <span class="badge rounded-pill"
                                      th:classappend="${note.valeur >= 16 ? 'text-bg-success' : (note.valeur >= 12 ? 'text-bg-info' : (note.valeur >= 10 ? 'text-bg-warning' : 'text-bg-danger'))}"
                                      th:text="${note.valeur}"></span>
                            </td>
                            <td th:text="${note.coefficient}"></td>
                            <td class="text-nowrap">
                                <a th:href="@{/notes/modifier/{id}(id=${note.id})}" class="btn btn-sm btn-outline-warning">
                                    <i class="bi bi-pencil"></i> Modifier
                                </a>
                                <a th:href="@{/notes/supprimer/{id}(id=${note.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Êtes-vous sûr ?')">
                                    <i class="bi bi-trash"></i> Supprimer
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="text-center text-app-subtle p-5" th:if="${#lists.isEmpty(notes)}">
            <i class="bi bi-award"></i>
            <p>Aucune note trouvée. Commencez par en saisir une.</p>
        </div>
    </div>

</div>
</body>
</html>
