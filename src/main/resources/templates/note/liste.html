<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Liste des Notes</h1>
        <a th:href="@{/notes/nouveau}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Saisir une Note</a>
    </div>
    
    <div class="card shadow">
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Étudiant</th>
                        <th>Cours</th>
                        <th>Type d'Évaluation</th>
                        <th>Valeur (/20)</th>
                        <th>Coefficient</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="note : ${notes}">
                        <td th:text="${note.inscription.etudiant.prenom + ' ' + note.inscription.etudiant.nom}"></td>
                        <td th:text="${note.inscription.cours.intitule}"></td>
                        <td th:text="${note.typeEvaluation}"></td>
                        <td th:text="${note.valeur}"></td>
                        <td th:text="${note.coefficient}"></td>
                        <td>
                            <a th:href="@{/notes/modifier/{id}(id=${note.id})}" class="btn btn-sm btn-warning">Modifier</a>
                            <a th:href="@{/notes/supprimer/{id}(id=${note.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Êtes-vous sûr ?')">Supprimer</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(notes)}">
                        <td colspan="6" class="text-center">Aucune note trouvée.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
