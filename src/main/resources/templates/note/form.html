<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${note.id == null ? 'Saisir une Note' : 'Modifier Note'}"></h1>
            <p class="page-subtitle">Enregistrez une évaluation pour un étudiant inscrit</p>
        </div>
    </div>

    <div class="custom-card form-card">
        <div class="custom-card-body">
            <form th:action="@{/notes/enregistrer}" th:object="${note}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label for="inscription" class="form-label-custom">Inscription (Étudiant — Cours)</label>
                    <select class="form-select form-select-dark" id="inscription" th:field="*{inscription}" required>
                        <option value="">Sélectionner une inscription</option>
                        <option th:each="insc : ${inscriptions}" th:value="${insc.id}" th:text="${insc.etudiant.prenom + ' ' + insc.etudiant.nom + ' — ' + insc.cours.intitule}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="typeEvaluation" class="form-label-custom">Type d'Évaluation</label>
                    <input type="text" class="form-control form-control-dark" id="typeEvaluation" th:field="*{typeEvaluation}" placeholder="Ex: Devoir, Examen, TP..." required>
                </div>

                <div class="row">
                    <div class="col-md-6 form-group">
                        <label for="valeur" class="form-label-custom">Valeur (/20)</label>
                        <input type="number" step="0.5" min="0" max="20" class="form-control form-control-dark" id="valeur" th:field="*{valeur}" placeholder="Ex: 15.5" required>
                    </div>
                    <div class="col-md-6 form-group">
                        <label for="coefficient" class="form-label-custom">Coefficient</label>
                        <input type="number" step="0.5" min="1" class="form-control form-control-dark" id="coefficient" th:field="*{coefficient}" placeholder="Ex: 2" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary-custom">
                        <i class="bi bi-check-lg"></i> Enregistrer
                    </button>
                    <a th:href="@{/notes}" class="btn btn-secondary-custom">
                        <i class="bi bi-arrow-left"></i> Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
