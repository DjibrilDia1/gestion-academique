<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1" th:text="${note.id == null ? 'Saisir une Note' : 'Modifier Note'}"></h1>
            <p class="text-app-muted mb-0">Enregistrez une évaluation pour un étudiant inscrit</p>
        </div>
    </div>

    <div class="card bg-app-panel border-app rounded-4 shadow-app"><div class="card-body p-4 p-md-5">
            <form th:action="@{/notes/enregistrer}" th:object="${note}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="inscription" class="form-label text-app-muted">Inscription (Étudiant — Cours)</label>
                    <select class="form-select" id="inscription" th:field="*{inscription}" required>
                        <option value="">Sélectionner une inscription</option>
                        <option th:each="insc : ${inscriptions}" th:value="${insc.id}" th:text="${insc.etudiant.prenom + ' ' + insc.etudiant.nom + ' — ' + insc.cours.intitule}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="typeEvaluation" class="form-label text-app-muted">Type d'Évaluation</label>
                    <input type="text" class="form-control" id="typeEvaluation" th:field="*{typeEvaluation}" placeholder="Ex: Devoir, Examen, TP..." required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="valeur" class="form-label text-app-muted">Valeur (/20)</label>
                        <input type="number" step="0.5" min="0" max="20" class="form-control" id="valeur" th:field="*{valeur}" placeholder="Ex: 15.5" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="coefficient" class="form-label text-app-muted">Coefficient</label>
                        <input type="number" step="0.5" min="1" class="form-control" id="coefficient" th:field="*{coefficient}" placeholder="Ex: 2" required>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4 pt-4 border-top border-app">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> Enregistrer
                    </button>
                    <a th:href="@{/notes}" class="btn btn-outline-light">
                        <i class="bi bi-arrow-left"></i> Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
