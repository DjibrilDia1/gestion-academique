<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Groupe SupdeCo Dakar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <!-- Logo SupdeCo Container -->
        <div class="login-logo-container">
            <img th:src="@{/images/logo.png}" alt="Groupe SupdeCo Dakar" class="login-logo-img">
        </div>

        <h4 class="text-center text-white fw-bold mb-1">Espace Académique</h4>
        <p class="text-center text-secondary mb-4" style="font-size: 0.9rem;">Connectez-vous pour accéder au portail</p>

        <!-- Error & Success Messages -->
        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center mb-3" style="background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; border-radius: 10px;">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <span>Identifiants incorrects. Veuillez réessayer.</span>
        </div>
        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center mb-3" style="background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #6ee7b7; border-radius: 10px;">
            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
            <span>Déconnexion réussie.</span>
        </div>

        <form th:action="@{/connexion}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label-custom">Nom d'utilisateur</label>
                <div class="input-group">
                    <span class="input-group-text form-control-dark" style="border-right: none; border-top-right-radius: 0; border-bottom-right-radius: 0; color: var(--text-secondary);">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" id="username" name="username" class="form-control form-control-dark" style="border-left: none; border-top-left-radius: 0; border-bottom-left-radius: 0;" placeholder="ex: admin" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label-custom">Mot de passe</label>
                <div class="input-group">
                    <span class="input-group-text form-control-dark" style="border-right: none; border-top-right-radius: 0; border-bottom-right-radius: 0; color: var(--text-secondary);">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" class="form-control form-control-dark" style="border-left: none; border-top-left-radius: 0; border-bottom-left-radius: 0;" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-3 d-flex align-items-center justify-content-center gap-2">
                <span>Se Connecter</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div class="text-center mt-4">
            <small class="text-muted">&copy; 2026 Groupe SupdeCo Dakar - Tous droits réservés</small>
        </div>
    </div>
</div>

</body>
</html>
