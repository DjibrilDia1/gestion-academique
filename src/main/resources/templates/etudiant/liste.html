<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="page-header">
        <div>
            <h1 class="page-title">Liste des Étudiants</h1>
            <p class="page-subtitle">Consultez et gérez les étudiants inscrits</p>
        </div>
        <a th:href="@{/etudiants/nouveau}" class="btn btn-primary-custom">
            <i class="bi bi-plus-circle"></i> Nouvel Étudiant
        </a>
    </div>

    <div class="custom-card">
        <div class="custom-card-body" th:if="${!#lists.isEmpty(etudiants)}">
            <div class="table-count">
                <i class="bi bi-people"></i>
                <span th:text="${#lists.size(etudiants)} + ' étudiant(s)'">0 étudiant(s)</span>
            </div>
            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                        <tr>
                            <th>Matricule</th>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="etudiant : ${etudiants}">
                            <td><span class="badge-matricule" th:text="${etudiant.matricule}"></span></td>
                            <td th:text="${etudiant.nom}"></td>
                            <td th:text="${etudiant.prenom}"></td>
                            <td th:text="${etudiant.email}"></td>
                            <td class="actions-cell">
                                <a th:href="@{/etudiants/modifier/{id}(id=${etudiant.id})}" class="btn-action btn-action-edit">
                                    <i class="bi bi-pencil"></i> Modifier
                                </a>
                                <a th:href="@{/etudiants/supprimer/{id}(id=${etudiant.id})}" class="btn-action btn-action-delete" onclick="return confirm('Êtes-vous sûr ?')">
                                    <i class="bi bi-trash"></i> Supprimer
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(etudiants)}">
            <i class="bi bi-people"></i>
            <p>Aucun étudiant trouvé. Commencez par en ajouter un.</p>
        </div>
    </div>

</div>
</body>
</html>
