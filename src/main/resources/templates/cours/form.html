<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1" th:text="${cours.id == null ? 'Nouveau Cours' : 'Modifier Cours'}"></h1>
            <p class="text-app-muted mb-0" th:text="${cours.id == null ? 'Ajoutez un nouveau cours au catalogue' : 'Modifiez les informations du cours'}"></p>
        </div>
    </div>

    <div class="card bg-app-panel border-app rounded-4 shadow-app">
        <div class="card-body p-4 p-md-5">
            <form th:action="@{/cours/enregistrer}" th:object="${cours}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="code" class="form-label text-app-muted">Code</label>
                    <input type="text" class="form-control" id="code" th:field="*{code}" placeholder="Ex: GL301" required>
                </div>

                <div class="mb-3">
                    <label for="intitule" class="form-label text-app-muted">Intitulé</label>
                    <input type="text" class="form-control" id="intitule" th:field="*{intitule}" placeholder="Ex: Programmation Java Avancée" required>
                </div>

                <div class="mb-3">
                    <label for="credits" class="form-label text-app-muted">Crédits</label>
                    <input type="number" class="form-control" id="credits" th:field="*{credits}" required min="1" placeholder="Ex: 4">
                </div>

                <div class="d-flex gap-2 mt-4 pt-4 border-top border-app">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> Enregistrer
                    </button>
                    <a th:href="@{/cours}" class="btn btn-outline-light">
                        <i class="bi bi-arrow-left"></i> Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
