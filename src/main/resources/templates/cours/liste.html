<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Liste des Cours</h1>
        <a th:href="@{/cours/nouveau}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nouveau Cours</a>
    </div>
    
    <div class="card shadow">
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Intitulé</th>
                        <th>Crédits</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${cours}">
                        <td th:text="${c.code}"></td>
                        <td th:text="${c.intitule}"></td>
                        <td th:text="${c.credits}"></td>
                        <td>
                            <a th:href="@{/cours/modifier/{id}(id=${c.id})}" class="btn btn-sm btn-warning">Modifier</a>
                            <a th:href="@{/cours/supprimer/{id}(id=${c.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Êtes-vous sûr ?')">Supprimer</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(cours)}">
                        <td colspan="4" class="text-center">Aucun cours trouvé.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
