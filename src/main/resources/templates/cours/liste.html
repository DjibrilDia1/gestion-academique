<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="page-header">
        <div>
            <h1 class="page-title">Liste des Cours</h1>
            <p class="page-subtitle">Consultez et gérez le catalogue de cours</p>
        </div>
        <a th:href="@{/cours/nouveau}" class="btn btn-primary-custom">
            <i class="bi bi-plus-circle"></i> Nouveau Cours
        </a>
    </div>

    <div class="custom-card">
        <div class="custom-card-body" th:if="${!#lists.isEmpty(cours)}">
            <div class="table-count">
                <i class="bi bi-journal-bookmark"></i>
                <span th:text="${#lists.size(cours)} + ' cours'">0 cours</span>
            </div>
            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Intitulé</th>
                            <th>Crédits</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${cours}">
                            <td><span class="badge-matricule" th:text="${c.code}"></span></td>
                            <td th:text="${c.intitule}"></td>
                            <td><span class="badge-type" th:text="${c.credits} + ' crédits'"></span></td>
                            <td class="actions-cell">
                                <a th:href="@{/cours/modifier/{id}(id=${c.id})}" class="btn-action btn-action-edit">
                                    <i class="bi bi-pencil"></i> Modifier
                                </a>
                                <a th:href="@{/cours/supprimer/{id}(id=${c.id})}" class="btn-action btn-action-delete" onclick="return confirm('Êtes-vous sûr ?')">
                                    <i class="bi bi-trash"></i> Supprimer
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(cours)}">
            <i class="bi bi-journal-bookmark"></i>
            <p>Aucun cours trouvé. Commencez par en ajouter un.</p>
        </div>
    </div>

</div>
</body>
</html>
