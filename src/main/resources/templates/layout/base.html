<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupe SupdeCo Dakar - Gestion Académique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="d-flex min-vh-100">
    <!-- Sidebar -->
    <aside id="appSidebar" class="app-sidebar d-none d-md-flex flex-column flex-shrink-0 vh-100 sticky-top bg-sidebar-solid text-white shadow-lg" th:if="${#authorization.expression('isAuthenticated()')}">
        <div class="d-flex align-items-center px-4 border-bottom border-white border-opacity-10 sidebar-top">
            <button id="sidebarToggle" type="button" class="btn btn-link text-white p-0 border-0 sidebar-toggle" aria-label="Fermer la sidebar" aria-expanded="true">
                <i class="bi bi-chevron-left fs-4"></i>
            </button>
        </div>
        <nav class="nav flex-column flex-grow-1 overflow-auto py-2">
            <span class="sidebar-section-title px-4 pt-3 pb-2">Navigation</span>
            <a th:href="@{/tableau-de-bord}" class="sidebar-menu-link nav-link text-white d-flex align-items-center gap-3 px-4" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.startsWith('/tableau-de-bord') ? 'active fw-semibold' : ''}">
                <i class="bi bi-house fs-4"></i>
                <span class="sidebar-label">Tableau de bord</span>
            </a>
            <span class="sidebar-section-title px-4 pt-3 pb-2">Gestion Académique</span>
            <a th:href="@{/etudiants}" class="sidebar-menu-link nav-link text-white d-flex align-items-center gap-3 px-4" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.startsWith('/etudiants') ? 'active fw-semibold' : ''}">
                <i class="bi bi-people fs-4"></i>
                <span class="sidebar-label">Étudiants</span>
            </a>
            <a th:href="@{/cours}" class="sidebar-menu-link nav-link text-white d-flex align-items-center gap-3 px-4" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.startsWith('/cours') ? 'active fw-semibold' : ''}">
                <i class="bi bi-mortarboard fs-4"></i>
                <span class="sidebar-label">Cours</span>
            </a>
            <a th:href="@{/inscriptions}" class="sidebar-menu-link nav-link text-white d-flex align-items-center gap-3 px-4" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.startsWith('/inscriptions') ? 'active fw-semibold' : ''}">
                <i class="bi bi-briefcase fs-4"></i>
                <span class="sidebar-label">Inscriptions</span>
            </a>
            <a th:href="@{/notes}" class="sidebar-menu-link nav-link text-white d-flex align-items-center gap-3 px-4" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.startsWith('/notes') ? 'active fw-semibold' : ''}">
                <i class="bi bi-table fs-4"></i>
                <span class="sidebar-label">Notes &amp; Évaluations</span>
            </a>
        </nav>
        <div class="sidebar-footer border-top border-white border-opacity-25 p-3 bg-dark bg-opacity-10">
            <div class="d-flex align-items-center gap-2 rounded-3 bg-white bg-opacity-10 p-2">
                <span class="d-inline-flex align-items-center justify-content-center rounded-circle bg-warning text-dark fw-bold flex-shrink-0" style="width: 38px; height: 38px" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                <div class="sidebar-user-info flex-grow-1 overflow-hidden">
                    <div class="fw-semibold text-truncate small" th:text="${#authentication.name}">Utilisateur</div>
                    <div class="text-white-50 small" th:text="${#authorization.expression('hasRole(''ADMIN'')') ? 'Administrateur' : 'Enseignant'}">Rôle</div>
                </div>
                <form th:action="@{/deconnexion}" method="post" class="m-0"><button type="submit" class="btn btn-sm btn-outline-light border-0" title="Déconnexion"><i class="bi bi-box-arrow-right"></i></button></form>
            </div>
        </div>
    </aside>

    <!-- Main Section -->
    <main class="d-flex flex-column flex-grow-1" style="min-width: 0">

    <!-- Topbar Navigation -->
    <header class="sticky-top d-flex align-items-center justify-content-between gap-3 px-3 px-md-4 border-bottom border-app bg-app-topbar" style="min-height: 70px" th:if="${#authorization.expression('isAuthenticated()')}">
        <div class="d-flex align-items-center gap-3">
            <img th:src="@{/images/logo.png}" alt="Logo SupdeCo" class="rounded-3 shadow" style="height: 50px; padding: 4px 10px">
            <div class="small"><span class="text-app-subtle">Accueil</span><i class="bi bi-chevron-right mx-2 text-app-subtle" style="font-size: .7rem"></i><strong th:text="${pageTitle != null ? pageTitle : 'Gestion Académique'}">Gestion Académique</strong></div>
        </div>
        <span class="d-none d-sm-inline-block badge rounded-pill text-bg-primary px-3 py-2 fw-semibold">LICENCE 3 GÉNIE LOGICIEL</span>
    </header>

    <!-- Dynamic Content -->
    <div class="app-content flex-grow-1 p-3 p-md-5">
        <div th:replace="${content}"></div>
    </div>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const sidebar = document.getElementById('appSidebar');
        const toggle = document.getElementById('sidebarToggle');

        if (!sidebar || !toggle) {
            return;
        }

        toggle.addEventListener('click', function () {
            const isCollapsed = sidebar.classList.toggle('is-collapsed');
            toggle.setAttribute('aria-expanded', String(!isCollapsed));
            toggle.setAttribute('aria-label', isCollapsed ? 'Ouvrir la sidebar' : 'Fermer la sidebar');
            toggle.querySelector('i').className = isCollapsed ? 'bi bi-chevron-right fs-4' : 'bi bi-chevron-left fs-4';
        });
    });
</script>
</body>
</html>
